# Bağlantılar: Turkish Connections puzzles for CrossPoint.
#
# Authored for this project. Build and validate with
#   uv run --no-project --with pyyaml python3 scripts/gen_connections_tr.py --check --dict words.txt
# (words.txt: https://github.com/mertemin/turkish-word-list) and see the script
# for the format. Words are natural-case Turkish; the script upper-cases them
# with the Turkish rules. Levels: 0 easiest (sarı) .. 3 hardest (mor).
#
# lexicon: plausibility classes for the ambiguity check. A group with
# `theme: X` accepts every word of X; `hidden: X` accepts any word hiding an X
# word of 3+ letters; `fill` patterns are checked against the dictionary.

